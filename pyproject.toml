[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudstream-lakehouse"
version = "0.1.0"
description = "Real-time fraud detection lakehouse with Kafka, medallion processing, data quality, and dashboards."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["fraudstream*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

