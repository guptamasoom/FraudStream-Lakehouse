services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudstream}
      POSTGRES_DB: ${POSTGRES_DB:-fraudstream}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudstream"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - ./scripts:/opt/fraudstream/scripts
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-fraudstream}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-fraudstream123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-fraudstream} $${MINIO_SECRET_KEY:-fraudstream123} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-fraudstream-lakehouse} &&
      mc anonymous set download local/$${S3_BUCKET:-fraudstream-lakehouse}"

  dashboard:
    image: python:3.11-slim
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && python -m fraudstream.dashboard.app"
    environment:
      GOLD_DATA_PATH: ${GOLD_DATA_PATH:-data/gold}
      DASH_HOST: ${DASH_HOST:-0.0.0.0}
      DASH_PORT: ${DASH_PORT:-8060}
    ports:
      - "8060:8060"
    volumes:
      - .:/app

volumes:
  minio-data:
