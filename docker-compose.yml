services:

  # ============================================================
  # PostgreSQL - Airflow Metadata Database
  # ============================================================
  postgres:
    image: postgres:15

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5434:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # Airflow Initialization
  # ============================================================
  airflow-init:
    image: apache/airflow:2.10.5-python3.11

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__WEBSERVER__SECRET_KEY: fraudstream-airflow-secret-key-2026

      AWS_PROFILE: dev1
      AWS_REGION: us-east-1

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./fraudstream:/opt/airflow/fraudstream
      - ./.env:/opt/airflow/.env
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ${USERPROFILE}/.aws:/home/airflow/.aws:ro

    entrypoint: /bin/bash

    command:
      - -c
      - |
        pip install --no-cache-dir -r /opt/airflow/requirements.txt
        airflow db migrate

        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true


  # ============================================================
  # Airflow Webserver
  # ============================================================
  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__WEBSERVER__SECRET_KEY: fraudstream-airflow-secret-key-2026

      AWS_PROFILE: dev1
      AWS_REGION: us-east-1

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      KAFKA_SASL_MECHANISMS: ${KAFKA_SASL_MECHANISMS}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}

      S3_BUCKET: ${S3_BUCKET}
      S3_LANDING_PREFIX: ${S3_LANDING_PREFIX}
      S3_BRONZE_PREFIX: ${S3_BRONZE_PREFIX}
      S3_SILVER_PREFIX: ${S3_SILVER_PREFIX}
      S3_QUARANTINE_PREFIX: ${S3_QUARANTINE_PREFIX}
      S3_GOLD_PREFIX: ${S3_GOLD_PREFIX}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./fraudstream:/opt/airflow/fraudstream
      - ./.env:/opt/airflow/.env
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ${USERPROFILE}/.aws:/home/airflow/.aws:ro

    ports:
      - "8080:8080"

    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir -r /opt/airflow/requirements.txt
        airflow webserver


  # ============================================================
  # Airflow Scheduler
  # ============================================================
  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__WEBSERVER__SECRET_KEY: fraudstream-airflow-secret-key-2026

      AWS_PROFILE: dev1
      AWS_REGION: us-east-1

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      KAFKA_SASL_MECHANISMS: ${KAFKA_SASL_MECHANISMS}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}

      S3_BUCKET: ${S3_BUCKET}
      S3_LANDING_PREFIX: ${S3_LANDING_PREFIX}
      S3_BRONZE_PREFIX: ${S3_BRONZE_PREFIX}
      S3_SILVER_PREFIX: ${S3_SILVER_PREFIX}
      S3_QUARANTINE_PREFIX: ${S3_QUARANTINE_PREFIX}
      S3_GOLD_PREFIX: ${S3_GOLD_PREFIX}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./fraudstream:/opt/airflow/fraudstream
      - ./.env:/opt/airflow/.env
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ${USERPROFILE}/.aws:/home/airflow/.aws:ro

    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir -r /opt/airflow/requirements.txt
        airflow scheduler


  # ============================================================
  # Dashboard
  # ============================================================
  dashboard:
    image: python:3.11-slim

    working_dir: /app

    volumes:
      - ./dashboard:/app/dashboard
      - ./fraudstream:/app/fraudstream
      - ./data:/app/data
      - ./.env:/app/.env
      - ./requirements.txt:/app/requirements.txt

    ports:
      - "8060:8060"

    environment:
      DASH_HOST: 0.0.0.0
      DASH_PORT: 8060
      GOLD_DATA_PATH: data/gold

    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir -r /app/requirements.txt
        python dashboard/app.py


# ==============================================================
# Volumes
# ==============================================================
volumes:
  postgres-data: